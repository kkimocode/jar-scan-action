# Tests the scanner itself (runs in this action's own repo).
name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  action-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build a clean test jar
        run: |
          mkdir -p smoke/src smoke/out
          printf 'public class Hello { public static void main(String[] a){ System.out.println("hi"); } }' > smoke/src/Hello.java
          javac -d smoke/out smoke/src/Hello.java
          (cd smoke/out && jar cf ../hello.jar Hello.class)
      - name: Run the action on it
        id: scan
        uses: ./
        with:
          paths: smoke/hello.jar
      - name: Check result
        run: test "${{ steps.scan.outputs.result }}" = "pass"
